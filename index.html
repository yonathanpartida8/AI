  <style>
/* ============================================================
 * css/editor.css — Interfaz del editor (tema oscuro profesional)
 * ============================================================ */

:root {
  --bg: #0a0e1a;
  --panel: #0f1424;
  --panel-2: #141a2e;
  --border: #232b42;
  --text: #dbe2f0;
  --text-dim: #8b94ab;
  --accent: #6366f1;
  --accent-2: #818cf8;
  --danger: #ef4444;
  --radius: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 system-ui, -apple-system, sans-serif;
  overscroll-behavior: none;
}

body { display: flex; flex-direction: column; }

button { font: inherit; color: inherit; }

/* ── Topbar ─────────────────────────────────────────── */

#topbar {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 48px;
  padding: 0 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex: none;
  overflow-x: auto;
  scrollbar-width: none;
}

.brand { font-weight: 800; color: var(--accent-2); white-space: nowrap; }
.sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; flex: none; }
.spacer { flex: 1; }
.zoom-label { min-width: 44px; text-align: center; color: var(--text-dim); font-variant-numeric: tabular-nums; }

.saved-dot { color: #334155; transition: color .3s; font-size: 10px; }
.saved-dot.flash { color: #34d399; }

.btn {
  padding: 6px 10px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, border-color .15s;
}
.btn:hover { background: #1b2340; border-color: #33406b; }
.btn.active, .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #4f52e0; }
.btn.danger:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.block { display: block; width: 100%; margin: 8px 0; }
.btn-row { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }

.seg { display: flex; background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.seg-btn { padding: 6px 10px; background: none; border: none; cursor: pointer; color: var(--text-dim); white-space: nowrap; }
.seg-btn.active { background: var(--accent); color: #fff; }

/* ── Layout ─────────────────────────────────────────── */

#workspace { display: flex; flex: 1; min-height: 0; }

#left-panel, #right-panel {
  width: 250px;
  flex: none;
  background: var(--panel);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
#left-panel { border-right: 1px solid var(--border); }
#right-panel { border-left: 1px solid var(--border); padding: 12px; }

@media (max-width: 900px) {
  #left-panel, #right-panel { width: 200px; }
}

.panel-tabs { display: flex; border-bottom: 1px solid var(--border); flex: none; }
.tab-btn {
  flex: 1; padding: 10px 4px; background: none; border: none;
  border-bottom: 2px solid transparent; color: var(--text-dim); cursor: pointer; font-size: 12px;
}
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }

.panel-body { padding: 12px; overflow-y: auto; }
.panel-heading { margin: 14px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); }
.panel-hint { margin: 10px 0; color: var(--text-dim); font-size: 12px; }

/* ── Paleta de componentes ──────────────────────────── */

.palette-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.palette-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 12px 6px; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: var(--radius); cursor: grab; user-select: none; font-size: 12px;
  transition: transform .12s, border-color .12s;
}
.palette-item:hover { border-color: var(--accent); transform: translateY(-2px); }
.palette-item:active { cursor: grabbing; }
.palette-icon { font-size: 20px; color: var(--accent-2); }

.block-list { display: flex; flex-direction: column; gap: 6px; }
.block-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 10px 12px; background: linear-gradient(135deg, rgba(99,102,241,.14), rgba(139,92,246,.06));
  border: 1px solid var(--border); border-radius: var(--radius);
  cursor: pointer; text-align: left; font-size: 12px;
  transition: border-color .12s, transform .12s;
}
.block-item:hover { border-color: var(--accent); transform: translateX(3px); }

/* ── Assets ─────────────────────────────────────────── */

.input {
  width: 100%; padding: 7px 9px; background: var(--panel-2);
  border: 1px solid var(--border); border-radius: var(--radius); color: var(--text);
  font: inherit;
}
.input.block { margin: 8px 0; }
.input:focus { outline: none; border-color: var(--accent); }

.chip-row { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
.chip {
  padding: 4px 10px; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 999px; cursor: pointer; font-size: 12px;
}
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.asset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.asset-card {
  position: relative; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; cursor: grab;
}
.asset-card:hover { border-color: var(--accent); }
.asset-thumb { display: block; width: 100%; height: 72px; object-fit: cover; background: #000; }
.asset-thumb.kind-icon { display: flex; align-items: center; justify-content: center; font-size: 28px; }
.asset-name {
  display: block; padding: 4px 6px; font-size: 11px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.asset-del {
  position: absolute; top: 4px; right: 4px; width: 20px; height: 20px;
  border: none; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff;
  cursor: pointer; display: none;
}
.asset-card:hover .asset-del { display: block; }

/* ── Páginas y capas ────────────────────────────────── */

.page-list, .layer-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.page-item, .layer-item {
  display: flex; align-items: center; gap: 6px; padding: 7px 9px;
  background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius);
  cursor: pointer;
}
.page-item.active, .layer-item.active { border-color: var(--accent); background: rgba(99,102,241,.12); }
.page-name, .layer-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layer-icon { color: var(--accent-2); flex: none; }
.page-actions, .layer-actions { display: flex; gap: 2px; flex: none; }
.page-actions button, .layer-actions button {
  width: 20px; height: 20px; padding: 0; background: none; border: none;
  color: var(--text-dim); cursor: pointer; border-radius: 4px; font-size: 11px;
}
.page-actions button:hover, .layer-actions button:hover { background: var(--border); color: var(--text); }

/* ── Panel de propiedades ───────────────────────────── */

.props-title { margin-bottom: 6px; font-size: 14px; }
.name-input { font-weight: 700; }
.device-note { margin-bottom: 10px; font-size: 11px; color: var(--accent-2); }

.props-section { margin-bottom: 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel-2); }
.props-section summary {
  padding: 8px 10px; cursor: pointer; font-weight: 600; font-size: 12px;
  list-style: none; user-select: none;
}
.props-section summary::before { content: '▸ '; color: var(--text-dim); }
.props-section[open] summary::before { content: '▾ '; }
.props-section-body { padding: 4px 10px 10px; }

.field { display: block; margin-bottom: 8px; }
.field-label { display: block; margin-bottom: 3px; font-size: 11px; color: var(--text-dim); }
.field.check { display: flex; align-items: center; gap: 8px; }
.field.check .field-label { margin: 0; }

.frame-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
.color-field { display: flex; gap: 6px; }
.color-field input[type="color"] { width: 34px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: none; cursor: pointer; }
.color-field .input { flex: 1; }

.event-row { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed var(--border); }
.event-row > :nth-child(3) { grid-column: 1; }
.mini-list { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
.mini-chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px;
  background: var(--border); border-radius: 999px; font-size: 11px;
}
.mini-chip button { border: none; background: none; color: var(--text-dim); cursor: pointer; }

/* ── Lienzo ─────────────────────────────────────────── */

#stage-area {
  position: relative; flex: 1; min-width: 0;
  display: grid;
  grid-template: 24px 1fr / 24px 1fr;
}
#ruler-corner { background: var(--panel); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); z-index: 3; }
#ruler-h-wrap { overflow: hidden; border-bottom: 1px solid var(--border); z-index: 2; }
#ruler-v-wrap { overflow: hidden; border-right: 1px solid var(--border); z-index: 2; }
#ruler-h, #ruler-v { display: block; }

#viewport {
  position: relative; overflow: hidden; touch-action: none;
  background:
    radial-gradient(circle at 20% 10%, rgba(99,102,241,.06), transparent 45%),
    var(--bg);
  cursor: default;
}
#viewport.panning { cursor: grab; }

#world { position: absolute; top: 0; left: 0; transform-origin: 0 0; --izoom: 1; }

#artboard {
  position: absolute; top: 0; left: 0;
  background: #0b1020;
  box-shadow: 0 0 0 1px var(--border), 0 30px 80px rgba(0,0,0,.55);
  overflow: hidden;
}
#artboard.show-grid {
  background-image:
    linear-gradient(rgba(148,163,184,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148,163,184,.06) 1px, transparent 1px);
  background-size: var(--grid-size, 8px) var(--grid-size, 8px);
}

#guides { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; z-index: 40; }
#guides line { stroke: #f472b6; stroke-width: calc(1px * var(--izoom, 1)); stroke-dasharray: 4 3; }

#draw-layer { position: absolute; top: 0; left: 0; z-index: 50; pointer-events: none; touch-action: none; }
#draw-layer.active { pointer-events: auto; cursor: crosshair; }

#overlay { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 60; }

/* Nodos dentro del artboard */
.wb-node { position: absolute; user-select: none; }
.wb-node .wb-text { width: 100%; height: 100%; font: inherit; color: inherit; text-align: inherit; outline: none; }
.wb-btn {
  width: 100%; height: 100%; font: inherit; color: inherit; text-align: inherit;
  background: inherit; border: none; border-radius: inherit; cursor: default; pointer-events: none;
}
.wb-icon { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; font-size: inherit; }
.wb-placeholder {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  width: 100%; height: 100%; border: 2px dashed #334155; border-radius: inherit;
  color: #64748b; font-weight: 600; text-align: center; padding: 8px;
}
.wb-placeholder small { font-weight: 400; font-size: 11px; }
.wb-tag-label {
  position: absolute; top: 4px; left: 6px; font-size: 10px; color: rgba(148,163,184,.6);
  pointer-events: none;
}
.wb-slider { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: inherit; }
.wb-slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
.wb-slide.active { opacity: 1; }
.wb-form { display: flex; flex-direction: column; gap: 10px; width: 100%; height: 100%; padding: 20px; border-radius: inherit; background: inherit; color: inherit; overflow: hidden; }
.wb-form input, .wb-form textarea {
  padding: 10px; border-radius: 8px; border: 1px solid rgba(148,163,184,.35);
  background: rgba(148,163,184,.1); color: inherit; font: inherit; pointer-events: none;
}
.wb-form button { padding: 12px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 700; pointer-events: none; }
.wb-menu { display: flex; width: 100%; height: 100%; align-items: center; justify-content: space-between; padding: 0 28px; border-radius: inherit; background: inherit; }
.wb-menu-links { display: flex; gap: 22px; }
.wb-menu a { color: inherit; text-decoration: none; opacity: .85; pointer-events: none; }
.wb-player { display: flex; gap: 14px; align-items: center; width: 100%; height: 100%; padding: 14px; border-radius: inherit; background: inherit; color: inherit; }
.wb-player-disc {
  display: flex; width: 56px; height: 56px; flex: none; align-items: center; justify-content: center;
  border-radius: 50%; background: rgba(255,255,255,.15); font-size: 24px;
  animation: wb-disc-spin 6s linear infinite;
}
@keyframes wb-disc-spin { to { transform: rotate(360deg); } }
.wb-player-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.wb-player-info span, .wb-player-info small { opacity: .7; font-size: 12px; }
.wb-3d, .wb-particles { display: block; width: 100%; height: 100%; border-radius: inherit; }
.wb-3d canvas { border-radius: inherit; }
.wb-3d-loading {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 100%; height: 100%; color: #64748b; text-align: center; gap: 6px;
  background: radial-gradient(circle, rgba(99,102,241,.12), transparent 70%);
  border-radius: inherit; font-size: 22px;
}
.wb-3d-loading small { font-size: 11px; }
.wb-gallery img { border-radius: 6px; }
.wb-node.locked { outline: 1px dashed rgba(148,163,184,.4); }

/* ── Selección y tiradores ──────────────────────────── */

.sel-box {
  position: absolute; pointer-events: none;
  outline: calc(1.5px * var(--izoom, 1)) solid var(--accent-2);
}
.sel-box.locked { outline-style: dashed; }
.handle {
  position: absolute; width: 10px; height: 10px;
  background: #fff; border: 1.5px solid var(--accent);
  border-radius: 3px; pointer-events: auto;
  transform: translate(-50%, -50%) scale(var(--izoom, 1));
}
.h-nw { top: 0; left: 0; cursor: nwse-resize; }
.h-n  { top: 0; left: 50%; cursor: ns-resize; }
.h-ne { top: 0; left: 100%; cursor: nesw-resize; }
.h-e  { top: 50%; left: 100%; cursor: ew-resize; }
.h-se { top: 100%; left: 100%; cursor: nwse-resize; }
.h-s  { top: 100%; left: 50%; cursor: ns-resize; }
.h-sw { top: 100%; left: 0; cursor: nesw-resize; }
.h-w  { top: 50%; left: 0; cursor: ew-resize; }
.h-rotate {
  top: -22px; left: 50%; border-radius: 50%; cursor: grab;
  background: var(--accent); border-color: #fff;
}
.sel-label {
  position: absolute; bottom: 100%; left: 0; margin-bottom: 26px;
  padding: 2px 7px; background: var(--accent); color: #fff;
  border-radius: 5px; font-size: 11px; white-space: nowrap;
  transform: scale(var(--izoom, 1)); transform-origin: bottom left;
}

#marquee {
  position: absolute; border: 1px solid var(--accent-2);
  background: rgba(99,102,241,.12); pointer-events: none; z-index: 70;
}

/* ── Barra de dibujo ────────────────────────────────── */

.draw-toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 12px; background: var(--panel-2); border-bottom: 1px solid var(--border);
}
.draw-toolbar label { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 12px; }
.draw-toolbar input[type="color"] { width: 30px; height: 30px; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: none; }

/* ── Modo vista previa ──────────────────────────────── */

body.preview #left-panel,
body.preview #right-panel,
body.preview #overlay,
body.preview #ruler-h-wrap,
body.preview #ruler-v-wrap,
body.preview #ruler-corner { display: none; }
body.preview #stage-area { grid-template: 0 1fr / 0 1fr; }
body.preview .wb-btn, body.preview .wb-menu a, body.preview .wb-form input,
body.preview .wb-form textarea, body.preview .wb-form button { pointer-events: auto; cursor: pointer; }
body.preview .wb-node { user-select: text; }
body.preview .wb-placeholder { opacity: .25; }

/* ── Scrollbars ─────────────────────────────────────── */

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }

  </style>
</head>

      </div>
    </main>

    <aside id="right-panel"></aside>
  </div>

          const snapped = this.#snap(f0.x + dx, f0.y + dy, f0.w, f0.h, [...g.frames.keys()]);
          dx += snapped.dx;
          dy += snapped.dy;
          this.view.showGuides(snapped.lines);
        }
        for (const [id, f0] of g.frames) {
          const node2 = this.store.node(id);
          this.store.setFrame(node2, { x: Math.round(f0.x + dx), y: Math.round(f0.y + dy) });
          const elem = this.#nodeEl(id);
          if (elem) syncNodeEl(elem, node2, this.store);
        }
        this.updateOverlay();
        return;
      }
      if (g.kind === "resize") {
        const point = this.view.toArtboard(e.clientX, e.clientY);
        const dx = point.x - g.start.x, dy = point.y - g.start.y;
        const f = { ...g.frame };
        const h = g.handle;
        if (h.includes("e")) f.w = Math.max(16, g.frame.w + dx);
        if (h.includes("s")) f.h = Math.max(16, g.frame.h + dy);
        if (h.includes("w")) {
          f.w = Math.max(16, g.frame.w - dx);
          f.x = g.frame.x + g.frame.w - f.w;
        }
        if (h.includes("n")) {
          f.h = Math.max(16, g.frame.h - dy);
          f.y = g.frame.y + g.frame.h - f.h;
        }
        if (e.shiftKey && g.frame.w && g.frame.h) {
          const ratio = g.frame.w / g.frame.h;
          if (h.includes("e") || h.includes("w")) f.h = f.w / ratio;
          else f.w = f.h * ratio;
        }
        this.store.setFrame(g.node, { x: Math.round(f.x), y: Math.round(f.y), w: Math.round(f.w), h: Math.round(f.h) });
        const elem = this.#nodeEl(g.node.id);
        if (elem) syncNodeEl(elem, g.node, this.store);
        this.updateOverlay();
        return;
      }
      if (g.kind === "rotate") {
        const angle = Math.atan2(e.clientY - g.cy, e.clientX - g.cx);
        let deg = g.startRotation + (angle - g.startAngle) * 180 / Math.PI;
        if (e.shiftKey) deg = Math.round(deg / 15) * 15;
        this.store.setFrame(g.node, { rotation: Math.round(deg) });
        const elem = this.#nodeEl(g.node.id);
        if (elem) syncNodeEl(elem, g.node, this.store);
        this.updateOverlay();
      }
    }
    /* ── Fin de gesto ──────────────────────────────────── */
    #onUp(e) {
      this.pointers.delete(e.pointerId);
      const g = this.gesture;
      if (!g) return;
      if (g.kind === "pinch" && this.pointers.size > 0) return;
      this.gesture = null;
      this.view.clearGuides();
      document.getElementById("marquee")?.remove();
      if (g.kind === "marquee" && g.x1 != null) {
        const [x0, x1] = [Math.min(g.x0, g.x1), Math.max(g.x0, g.x1)];
        const [y0, y1] = [Math.min(g.y0, g.y1), Math.max(g.y0, g.y1)];
        const hits = this.store.pageNodes().filter((n) => {
          const f = this.store.frame(n);
          return f.x < x1 && f.x + f.w > x0 && f.y < y1 && f.y + f.h > y0;
        }).map((n) => n.id);
        if (hits.length) this.store.select(hits, g.additive);
      }
      if (g.kind === "move" && g.moved || g.kind === "resize" || g.kind === "rotate") {
        const bottom = this.store.selectedNodes.reduce((max, n) => {
          const f = this.store.frame(n);
          return Math.max(max, f.y + f.h);
        }, 0);
        if (bottom > this.store.page.height) this.store.page.height = Math.ceil(bottom + 160);
        this.store.commit();
      }
    }
    #onWheel(e) {
      e.preventDefault();
      if (e.ctrlKey || e.metaKey) this.view.zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.1 : 0.9);
      else this.store.setView(null, { x: this.store.pan.x - e.deltaX, y: this.store.pan.y - e.deltaY });
    }
    /* ── Edición inline de texto ───────────────────────── */
    #onDblClick(e) {
      const nodeEl = e.target.closest(".wb-node");
      if (!nodeEl) return;
      const node2 = this.store.node(nodeEl.dataset.id);
      if (!node2 || node2.locked || !["text", "button"].includes(node2.type)) return;
      const target = nodeEl.querySelector(".wb-text, .wb-btn") || nodeEl;
      target.contentEditable = "plaintext-only";
      target.focus();
      document.getSelection()?.selectAllChildren(target);
      const finish = () => {
        target.contentEditable = "false";
        this.store.snapshot();
        this.store.updateNode(node2.id, "props", { text: target.innerText.trim() });
      };
      target.addEventListener("blur", finish, { once: true });
      target.addEventListener("keydown", (ev) => {
        if (ev.key === "Escape") target.blur();
        ev.stopPropagation();
      });
    }
    /* ── Snap a guías y rejilla ────────────────────────── */
    #snap(x, y, w, h, excludeIds) {
      const lines = [];
      let dx = 0, dy = 0;
      const threshold = SNAP_THRESHOLD / this.store.zoom;
      const width = this.store.project.settings.breakpoints[this.store.device];
      const height = this.store.page.height;
      const candidatesV = [0, width / 2, width];
      const candidatesH = [0, height / 2, height];
      for (const other of this.store.pageNodes()) {
        if (excludeIds.includes(other.id) || other.hidden) continue;
        const f = this.store.frame(other);
        candidatesV.push(f.x, f.x + f.w / 2, f.x + f.w);
        candidatesH.push(f.y, f.y + f.h / 2, f.y + f.h);
      }
      const edgesV = [x, x + w / 2, x + w];
      const edgesH = [y, y + h / 2, y + h];
      outer_v:
        for (const candidate of candidatesV) {
          for (const edge of edgesV) {
            if (Math.abs(edge - candidate) < threshold) {
              dx = candidate - edge;
              lines.push({ axis: "v", pos: candidate });
              break outer_v;
            }
          }
        }
      outer_h:
        for (const candidate of candidatesH) {
          for (const edge of edgesH) {
            if (Math.abs(edge - candidate) < threshold) {
              dy = candidate - edge;
              lines.push({ axis: "h", pos: candidate });
              break outer_h;
            }
          }
        }
      const grid = this.store.project.settings.grid;
      if (grid.snap) {
        if (!dx) dx = Math.round((x + dx) / grid.size) * grid.size - x;
        if (!dy) dy = Math.round((y + dy) / grid.size) * grid.size - y;
      }
      return { dx, dy, lines };
    }

    #renderMarquee(g) {
      let box = document.getElementById("marquee");
      if (!box) {
        box = document.createElement("div");
        box.id = "marquee";
        this.view.overlay.append(box);
      }
      box.style.left = `${Math.min(g.x0, g.x1)}px`;
      box.style.top = `${Math.min(g.y0, g.y1)}px`;
      box.style.width = `${Math.abs(g.x1 - g.x0)}px`;
      box.style.height = `${Math.abs(g.y1 - g.y0)}px`;
    }
    #renderOverlay() {
      const overlay = this.view.overlay;
      const marquee = document.getElementById("marquee");
      overlay.innerHTML = "";
      if (marquee) overlay.append(marquee);
      const selected = this.store.selectedNodes;
      const single = selected.length === 1;
      for (const node2 of selected) {
        const f = this.store.frame(node2);
        const box = document.createElement("div");
        box.className = `sel-box${node2.locked ? " locked" : ""}`;
        Object.assign(box.style, {
          left: `${f.x}px`,
          top: `${f.y}px`,
          width: `${f.w}px`,
          height: `${f.h}px`,
          transform: `rotate(${f.rotation || 0}deg)`
        });
        if (single && !node2.locked) {
          for (const h of ["nw", "n", "ne", "e", "se", "s", "sw", "w"]) {
            const handle = document.createElement("div");
            handle.className = `handle h-${h}`;
            handle.dataset.handle = h;
            box.append(handle);
          }
          const rot = document.createElement("div");
          rot.className = "handle h-rotate";
          rot.dataset.handle = "rotate";
          box.append(rot);
          const label = document.createElement("div");
          label.className = "sel-label";
          label.textContent = `${node2.name} \xB7 ${Math.round(f.w)}\xD7${Math.round(f.h)}`;
          box.append(label);
        }
        overlay.append(box);
      }
    }
  };

    #renderAssetGrid() {

      grid.innerHTML = "";
      const list = this.assets.list(this.assetFilter);
      if (!list.length) {
        grid.append(el("p", { class: "panel-hint", text: "Sin assets todav\xEDa. Sube im\xE1genes, GIFs, v\xEDdeos, audio o modelos GLB." }));
        return;
      }
      for (const asset2 of list) {
        const preview = asset2.kind === "video" ? el("video", { src: asset2.data, muted: "true", class: "asset-thumb" }) : ["image", "gif", "svg"].includes(asset2.kind) ? el("img", { src: asset2.data, class: "asset-thumb", draggable: "false" }) : el("div", { class: "asset-thumb kind-icon", text: ASSET_KINDS[asset2.kind].icon });
        const card = el("div", {
          class: "asset-card",
          draggable: "true",
          title: `${asset2.name} \xB7 ${formatBytes(asset2.size)} \xB7 carpeta: ${asset2.folder}`,
          ondragstart: (e) => e.dataTransfer.setData("application/x-wb-asset", asset2.id),
          onclick: () => this.#useAsset(asset2)

          preview,
          el("span", { class: "asset-name", text: asset2.name }),
          el("button", {
            class: "asset-del",
            text: "\xD7",
            title: "Eliminar asset",
            onclick: (e) => {
              e.stopPropagation();
              if (confirm(`\xBFEliminar "${asset2.name}"?`)) this.assets.remove(asset2.id);
            }
          })
        ]);
        grid.append(card);
      }
    }
    #useAsset(asset2, at = null) {
      const sel = this.store.selectedNodes[0];
      const def = sel && Components[sel.type];
      if (!at && sel && def?.accepts?.includes(asset2.kind === "svg" ? "image" : asset2.kind)) {
        if (def.schema.some((f) => f.key === "props.assetIds")) {
          this.store.updateNode(sel.id, "props", { assetIds: [...sel.props.assetIds || [], asset2.id] });
        } else {
          this.store.updateNode(sel.id, "props", { assetId: asset2.id });
        }
        return;
      }
      const type = this.assets.componentForAsset(asset2);
      if (!type) return;
      const width = this.store.project.settings.breakpoints[this.store.device];
      this.store.addNode(type, at || { x: Math.round(width / 2 - 160), y: 120 }, { props: { ...Components[type].defaults.props, assetId: asset2.id } });
    }
    /* ── Drop sobre el lienzo (componentes, assets, archivos del SO) ── */
    #setupCanvasDrop() {
      const vp = this.view.viewport;
      vp.addEventListener("dragover", (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
      });
      vp.addEventListener("drop", async (e) => {
        e.preventDefault();
        const at = this.view.toArtboard(e.clientX, e.clientY);
        const type = e.dataTransfer.getData("application/x-wb-component");
        if (type) {
          const def = Components[type];
          this.store.addNode(type, { x: Math.round(at.x - def.size[0] / 2), y: Math.round(at.y - def.size[1] / 2) });
          return;
        }
        const assetId = e.dataTransfer.getData("application/x-wb-asset");
        if (assetId) {
          const asset2 = this.assets.get(assetId);
          if (asset2) this.#useAsset(asset2, { x: Math.round(at.x - 140), y: Math.round(at.y - 100) });
          return;
        }
        if (e.dataTransfer.files?.length) {
          const imported = await this.assets.importFiles([...e.dataTransfer.files]);
          let offset = 0;
          for (const asset2 of imported) {
            this.#useAsset(asset2, { x: Math.round(at.x - 140 + offset), y: Math.round(at.y - 100 + offset) });
            offset += 28;
          }
        }
      });

  // src/editor/drawTool.js
  var DrawTool = class {
    constructor(store, assets, view) {
      this.store = store;
      this.assets = assets;
      this.view = view;
      this.canvas = view.drawLayer;
      this.ctx = this.canvas.getContext("2d");
      this.brush = { size: 8, color: "#f472b6", opacity: 1, eraser: false };
      this.strokes = [];
      this.drawing = false;
      this.toolbar = this.#buildToolbar();
      document.getElementById("draw-toolbar-slot").append(this.toolbar);
      store.on("tool", () => this.#onToolChange());
      store.on("change", () => this.#resize());
      this.canvas.addEventListener("pointerdown", (e) => this.#start(e));
      this.canvas.addEventListener("pointermove", (e) => this.#move(e));
      this.canvas.addEventListener("pointerup", () => this.#end());
      this.canvas.addEventListener("pointerleave", () => this.#end());
    }
    #onToolChange() {
      const active = this.store.tool === "draw";
      this.canvas.classList.toggle("active", active);
      this.toolbar.style.display = active ? "flex" : "none";
      if (active) this.#resize();
    }
    #resize() {
      const width = this.store.project.settings.breakpoints[this.store.device];
      const height = this.store.page.height;
      if (this.canvas.width === width && this.canvas.height === height) return;
      const prev = this.canvas.width ? this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height) : null;
      this.canvas.width = width;
      this.canvas.height = height;
      if (prev) this.ctx.putImageData(prev, 0, 0);
    }
    #point(e) {
      const rect = this.canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) / rect.width * this.canvas.width,
        y: (e.clientY - rect.top) / rect.height * this.canvas.height,
        pressure: e.pressure || 0.5
      };
    }
    #start(e) {
      if (this.store.tool !== "draw") return;
      this.canvas.setPointerCapture(e.pointerId);
      this.strokes.push(this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height));
      if (this.strokes.length > 20) this.strokes.shift();
      this.drawing = true;
      this.last = this.#point(e);
      this.#segment(this.last, this.last);
    }
    #move(e) {
      if (!this.drawing) return;
      const events = e.getCoalescedEvents?.() || [e];
      for (const ev of events) {
        const point = this.#point(ev);
        this.#segment(this.last, point);
        this.last = point;
      }
    }
    #segment(a, b) {
      const ctx = this.ctx;
      ctx.save();
      ctx.globalAlpha = this.brush.opacity;
      ctx.globalCompositeOperation = this.brush.eraser ? "destination-out" : "source-over";
      ctx.strokeStyle = this.brush.color;
      ctx.lineWidth = this.brush.size * (0.5 + (a.pressure + b.pressure) / 2);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.quadraticCurveTo(a.x, a.y, (a.x + b.x) / 2, (a.y + b.y) / 2);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.restore();
    }
    #end() {
      this.drawing = false;
    }
    undoStroke() {
      const prev = this.strokes.pop();
      if (prev) this.ctx.putImageData(prev, 0, 0);
    }
    clear() {
      this.strokes.push(this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height));
      this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    }
    /** Recorta el dibujo, lo guarda como asset PNG y crea un nodo. */
    async toComponent() {
      const { width, height } = this.canvas;
      const data = this.ctx.getImageData(0, 0, width, height).data;
      let minX = width, minY = height, maxX = 0, maxY = 0, found = false;
      for (let y = 0; y < height; y += 2) {
        for (let x = 0; x < width; x += 2) {
          if (data[(y * width + x) * 4 + 3] > 8) {
            found = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (!found) {
        alert("El lienzo de dibujo est\xE1 vac\xEDo.");
        return;
      }
      const pad = 6;
      minX = Math.max(0, minX - pad);
      minY = Math.max(0, minY - pad);
      maxX = Math.min(width, maxX + pad);
      maxY = Math.min(height, maxY + pad);
      const w = maxX - minX, h = maxY - minY;
      const crop = document.createElement("canvas");
      crop.width = w;
      crop.height = h;
      crop.getContext("2d").drawImage(this.canvas, minX, minY, w, h, 0, 0, w, h);
      const asset2 = await this.assets.addDataURL(`dibujo-${Date.now().toString(36)}.png`, crop.toDataURL("image/png"));
      this.ctx.clearRect(0, 0, width, height);
      this.store.addNode("drawing", { x: minX, y: minY, w, h }, { props: { assetId: asset2.id, fit: "contain" } });
      this.store.setTool("select");
    }
    #buildToolbar() {
      const bar = el("div", { class: "draw-toolbar", style: { display: "none" } }, [
        el("span", { text: "\u270E Dibujo:" }),
        el("input", { type: "color", value: this.brush.color, title: "Color", oninput: (e) => {
          this.brush.color = e.target.value;
          this.brush.eraser = false;
        } }),
        el("label", {}, ["Tama\xF1o ", el("input", { type: "range", min: 1, max: 80, value: this.brush.size, oninput: (e) => {
          this.brush.size = +e.target.value;
        } })]),
        el("label", {}, ["Opacidad ", el("input", { type: "range", min: 5, max: 100, value: 100, oninput: (e) => {
          this.brush.opacity = +e.target.value / 100;
        } })]),
        el("button", { class: "btn", text: "\u25EB Borrador", onclick: (e) => {
          this.brush.eraser = !this.brush.eraser;
          e.target.classList.toggle("active", this.brush.eraser);
        } }),
        el("button", { class: "btn", text: "\u21B6 Trazo", title: "Deshacer \xFAltimo trazo", onclick: () => this.undoStroke() }),
        el("button", { class: "btn", text: "\u{1F5D1} Limpiar", onclick: () => this.clear() }),
        el("button", { class: "btn primary", text: "\u2713 Convertir en componente", onclick: () => this.toComponent() }),
        el("button", { class: "btn", text: "\xD7 Salir", onclick: () => this.store.setTool("select") })
      ]);
      return bar;
    }
  };

  // src/webgl/particles.js
  var VS = `#version 300 es
in vec2 aPos;
in float aLife;
uniform float uSize;
uniform vec2 uRes;
out float vLife;
void main() {
  vec2 clip = (aPos / uRes) * 2.0 - 1.0;
  gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);
  gl_PointSize = uSize * (0.5 + vLife * 0.5 + aLife * 0.5);
  vLife = aLife;
}`;
  var FS = `#version 300 es
precision mediump float;
uniform vec3 uColor;
in float vLife;
out vec4 outColor;
void main() {
  float d = length(gl_PointCoord - vec2(0.5));
  float alpha = smoothstep(0.5, 0.0, d) * (0.35 + vLife * 0.65);
  outColor = vec4(uColor * (0.6 + vLife * 0.6), alpha);
}`;
  function compile(gl, type, src) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, src);
    gl.compileShader(shader);

    return shader;

      pos[i * 2 + 1] = Math.random() * H();
      vel[i * 2] = (Math.random() - 0.5) * 0.6;
      vel[i * 2 + 1] = (Math.random() - 0.5) * 0.6;

  // src/editor/main.js
  async function boot() {
    const store = new ProjectStore();
    await store.init();
    const assets = new AssetManager(store);
    await assets.init();
    const view = new CanvasView(store);
    const three = new ThreeManager(assets);
    new Interactions(store, view);
    new Panels(store, assets, view);
    new PropertiesPanel(store, assets, view);
    new DrawTool(store, assets, view);
    const exporter = new Exporter(store, assets);
    const repaint = () => renderPage(view.artboard, store, assets, { mountEmbeds: (root) => three.mountAll(root) });
    store.on("change", repaint);
    store.on("page", () => view.fit());
    buildTopbar(store, view, exporter, assets, repaint);
    bindKeyboard(store, view);
    view.syncSize();
    repaint();
    view.fit();
  }
  function buildTopbar(store, view, exporter, assets, repaint) {

    store.on("saved", () => {

      setTimeout(() => savedDot.classList.remove("flash"), 600);
    });
    const deviceButtons = el("div", { class: "seg" }, Object.entries(DEVICES).map(([key, meta]) => el("button", {
      class: `seg-btn${store.device === key ? " active" : ""}`,
      text: `${meta.icon} ${meta.label}`,
      dataset: { device: key },
      title: `${meta.width}px`,
      onclick: () => store.setDevice(key)
    })));
    store.on("device", () => {
      deviceButtons.querySelectorAll(".seg-btn").forEach((btn) => btn.classList.toggle("active", btn.dataset.device === store.device));
    });
    const zoomLabel = el("span", { class: "zoom-label", text: "100%" });
    store.on("view", () => {
      zoomLabel.textContent = `${Math.round(store.zoom * 100)}%`;
    });
    const fileInput = el("input", {
      type: "file",
      accept: ".json",
      style: { display: "none" },
      onchange: async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const data = JSON.parse(await file.text());
          if (Array.isArray(data.assetsData)) {
            await assets.importData(data.assetsData);
            delete data.assetsData;

      el("button", { class: "btn", text: "\u21B7", title: "Rehacer (Ctrl+Y)", onclick: () => store.redo() }),
      el("div", { class: "sep" }),
      deviceButtons,
      el("div", { class: "sep" }),

  var previewCleanup = null;
  function togglePreview(store, view, repaint) {
    const body = document.body;
    if (body.classList.contains("preview")) {
      body.classList.remove("preview");
      previewCleanup?.();
      previewCleanup = null;
      repaint();
      return;
    }
    body.classList.add("preview");
    store.clearSelection();
    repaint();
    const animations = [];
    const artboard = view.artboard;
    for (const node2 of store.pageNodes()) {
      const elem = artboard.querySelector(`[data-id="${node2.id}"]`);
      if (!elem) continue;
      const anim = node2.animation;
      if (anim?.preset && anim.preset !== "ninguna") {
        if (anim.trigger === "load") animations.push(playAnimation(elem, anim));
        else if (anim.trigger === "click") elem.addEventListener("click", () => playAnimation(elem, anim));
        else if (anim.trigger === "hover") elem.addEventListener("mouseenter", () => playAnimation(elem, anim));
        else if (anim.trigger === "scroll") {
          const io = new IntersectionObserver(([entry]) => {
            if (entry.isIntersecting) {
              playAnimation(elem, anim);
              io.disconnect();

          io.observe(elem);
        }
      }
      for (const event of node2.events || []) {
        const handler = () => {
          if (event.action === "goToPage") store.setPage(event.target);
          else if (event.action === "openUrl" && event.target) window.open(event.target, "_blank", "noopener");
          else if (event.action === "toggleNode") {
            const target = artboard.querySelector(`[data-id="${event.target}"]`);
            if (target) target.style.visibility = target.style.visibility === "hidden" ? "" : "hidden";
          } else if (event.action === "playAnimation") {
            const target = artboard.querySelector(`[data-id="${event.target}"]`);
            const targetNode = store.node(event.target);
            if (target && targetNode) playAnimation(target, targetNode.animation);
          }
        };
        elem.addEventListener(event.on === "hover" ? "mouseenter" : "click", handler);
        elem.style.cursor = "pointer";

    previewCleanup = () => animations.forEach((a) => a?.cancel());

  function bindKeyboard(store, view) {
    window.addEventListener("keydown", (e) => {
      if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable) return;
      const mod = e.ctrlKey || e.metaKey;
      if (mod && e.key === "z") {
        e.preventDefault();
        e.shiftKey ? store.redo() : store.undo();
      } else if (mod && e.key === "y") {
        e.preventDefault();
        store.redo();
      } else if (mod && e.key === "c") {
        store.copy();
      } else if (mod && e.key === "v") {
        store.paste();
      } else if (mod && e.key === "d") {
        e.preventDefault();
        store.duplicateNodes();
      } else if (mod && e.key === "s") {
        e.preventDefault();
        store.persist();
      } else if (mod && e.key === "a") {
        e.preventDefault();
        store.select(store.pageNodes().map((n) => n.id));
      } else if (e.key === "Delete" || e.key === "Backspace") {
        store.removeNodes();
      } else if (e.key === "Escape") {
        store.clearSelection();
        store.setTool("select");
      } else if (e.key.startsWith("Arrow")) {
        e.preventDefault();

      }

  boot().catch((err) => {
    console.error(err);
    document.body.innerHTML = `<pre style="color:#f87171;padding:40px">Error al iniciar el editor:
${err.stack}</pre>`;
  });
})();
