/* ============================================================
 * css/editor.css — Interfaz del editor (tema oscuro profesional)
 * ============================================================ */

/* Estética premium iPhone en clave ROMÁNTICA: glassmorphism,
   pasteles suaves (rosa/lila), profundidad y sombras delicadas. */
:root {
  --bg: #16101e;
  --panel: rgba(34, 24, 44, .78);
  --panel-2: rgba(255, 255, 255, .07);
  --border: rgba(255, 182, 215, .16);
  --text: #f8f2fb;
  --text-dim: #b7a5c7;
  --accent: #ff85b3;          /* rosa pastel */
  --accent-2: #cdb4f6;        /* lila pastel */
  --pink: #ff8fab;
  --danger: #ff6b81;
  --radius: 14px;
  --blur: saturate(170%) blur(24px);
  --grad: linear-gradient(135deg, #ff9bb8, #b28ff0);
}

/* Fondo con degradado suave respirando */
body::before {
  content: ''; position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(60% 50% at 18% 8%, rgba(255, 143, 171, .13), transparent 60%),
    radial-gradient(55% 45% at 85% 92%, rgba(178, 143, 240, .12), transparent 60%),
    var(--bg);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}

body { display: flex; flex-direction: column; }

button { font: inherit; color: inherit; }

/* ── Topbar ─────────────────────────────────────────── */

#topbar {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 50px;
  padding: 0 12px;
  background: var(--panel);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-bottom: .5px solid var(--border);
  flex: none;
  overflow-x: auto;
  scrollbar-width: none;
}

.brand { font-weight: 800; color: var(--pink); white-space: nowrap; letter-spacing: -.3px; }
.sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; flex: none; }
.spacer { flex: 1; }
.zoom-label { min-width: 44px; text-align: center; color: var(--text-dim); font-variant-numeric: tabular-nums; }

.saved-dot { color: #334155; transition: color .3s; font-size: 10px; }
.saved-dot.flash { color: #34d399; }

.btn {
  padding: 7px 12px;
  background: var(--panel-2);
  border: .5px solid var(--border);
  border-radius: 999px; /* píldoras iOS */
  cursor: pointer;
  white-space: nowrap;
  font-weight: 500;
  transition: background .15s, transform .12s cubic-bezier(.2,.8,.25,1), filter .15s;
}
.btn:hover { filter: brightness(1.25); }
.btn:active { transform: scale(.94); }
.btn.active, .btn.primary {
  background: var(--grad); border-color: transparent; color: #fff; font-weight: 600;
  box-shadow: 0 4px 16px rgba(255, 143, 171, .35);
}
.btn.primary:hover { filter: brightness(1.12); }
.btn.danger:hover { background: var(--danger); border-color: transparent; color: #fff; }
.btn.block { display: block; width: 100%; margin: 8px 0; border-radius: var(--radius); }
.btn-row { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }

/* Control segmentado iOS */
.seg { display: flex; background: rgba(118,118,128,.24); border: none; border-radius: 9px; overflow: hidden; padding: 2px; gap: 2px; }
.seg-btn { padding: 5px 11px; background: none; border: none; cursor: pointer; color: var(--text-dim); white-space: nowrap; border-radius: 7px; transition: background .18s, color .18s; }
.seg-btn.active { background: var(--grad); color: #fff; box-shadow: 0 2px 8px rgba(255,143,171,.4); }

/* ── Layout ─────────────────────────────────────────── */

#workspace { display: flex; flex: 1; min-height: 0; }

#left-panel, #right-panel {
  width: 252px;
  flex: none;
  background: var(--panel);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
#left-panel { border-right: .5px solid var(--border); }
#right-panel { border-left: .5px solid var(--border); padding: 12px; }

@media (max-width: 900px) {
  #left-panel, #right-panel { width: 200px; }
}

.panel-tabs { display: flex; border-bottom: 1px solid var(--border); flex: none; }
.tab-btn {
  flex: 1; padding: 10px 4px; background: none; border: none;
  border-bottom: 2px solid transparent; color: var(--text-dim); cursor: pointer; font-size: 12px;
}
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }

.panel-body { padding: 12px; overflow-y: auto; }
.panel-heading { margin: 14px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); }
.panel-hint { margin: 10px 0; color: var(--text-dim); font-size: 12px; }

/* ── Paleta de componentes ──────────────────────────── */

.palette-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.palette-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 12px 6px; background: var(--panel-2); border: .5px solid var(--border);
  border-radius: 14px; cursor: grab; user-select: none; font-size: 12px;
  transition: transform .15s cubic-bezier(.2,.8,.25,1), border-color .15s;
}
.palette-item:hover { border-color: var(--pink); transform: translateY(-2px) scale(1.02); }
.palette-item:active { cursor: grabbing; transform: scale(.95); }
.palette-icon { font-size: 20px; color: var(--pink); }

.block-list { display: flex; flex-direction: column; gap: 6px; }
.block-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 11px 12px; background: linear-gradient(135deg, rgba(255,55,95,.13), rgba(175,82,222,.07));
  border: .5px solid var(--border); border-radius: 14px;
  cursor: pointer; text-align: left; font-size: 12px; font-weight: 500;
  transition: border-color .15s, transform .15s cubic-bezier(.2,.8,.25,1);
}
.block-item:hover { border-color: var(--pink); transform: translateX(3px); }
.block-item:active { transform: scale(.97); }

/* ── Assets ─────────────────────────────────────────── */

.input {
  width: 100%; padding: 8px 10px; background: rgba(118,118,128,.18);
  border: .5px solid transparent; border-radius: 10px; color: var(--text);
  font: inherit;
}
.input.block { margin: 8px 0; }
.input:focus { outline: none; border-color: var(--accent); }

.chip-row { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
.chip {
  padding: 4px 10px; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 999px; cursor: pointer; font-size: 12px;
}
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.asset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.asset-card {
  position: relative; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; cursor: grab;
}
.asset-card:hover { border-color: var(--accent); }
.asset-thumb { display: block; width: 100%; height: 72px; object-fit: cover; background: #000; }
.asset-thumb.kind-icon { display: flex; align-items: center; justify-content: center; font-size: 28px; }
.asset-name {
  display: block; padding: 4px 6px; font-size: 11px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.asset-del {
  position: absolute; top: 4px; right: 4px; width: 20px; height: 20px;
  border: none; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff;
  cursor: pointer; display: none;
}
.asset-card:hover .asset-del { display: block; }

/* ── Páginas y capas ────────────────────────────────── */

.page-list, .layer-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.page-item, .layer-item {
  display: flex; align-items: center; gap: 6px; padding: 7px 9px;
  background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius);
  cursor: pointer;
}
.page-item.active, .layer-item.active { border-color: var(--accent); background: rgba(99,102,241,.12); }
.page-name, .layer-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layer-icon { color: var(--accent-2); flex: none; }
.page-actions, .layer-actions { display: flex; gap: 2px; flex: none; }
.page-actions button, .layer-actions button {
  width: 20px; height: 20px; padding: 0; background: none; border: none;
  color: var(--text-dim); cursor: pointer; border-radius: 4px; font-size: 11px;
}
.page-actions button:hover, .layer-actions button:hover { background: var(--border); color: var(--text); }

/* ── Panel de propiedades ───────────────────────────── */

.props-title { margin-bottom: 6px; font-size: 14px; }
.name-input { font-weight: 700; }
.device-note { margin-bottom: 10px; font-size: 11px; color: var(--accent-2); }

.props-section { margin-bottom: 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel-2); }
.props-section summary {
  padding: 8px 10px; cursor: pointer; font-weight: 600; font-size: 12px;
  list-style: none; user-select: none;
}
.props-section summary::before { content: '▸ '; color: var(--text-dim); }
.props-section[open] summary::before { content: '▾ '; }
.props-section-body { padding: 4px 10px 10px; }

.field { display: block; margin-bottom: 8px; }
.field-label { display: block; margin-bottom: 3px; font-size: 11px; color: var(--text-dim); }
.field.check { display: flex; align-items: center; gap: 8px; }
.field.check .field-label { margin: 0; }

.frame-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
.color-field { display: flex; gap: 6px; }
.color-field input[type="color"] { width: 34px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: none; cursor: pointer; }
.color-field .input { flex: 1; }

/* ── Editor de lógica visual (eventos + cadenas de acciones) ── */
.event-block {
  margin-bottom: 12px; padding: 8px; border: 1px solid var(--border);
  border-radius: 10px; background: rgba(99,102,241,.05);
}
.event-head { display: flex; gap: 6px; margin-bottom: 8px; }
.event-head select { flex: 1; }
.action-row {
  display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px;
  padding: 7px; border-left: 3px solid var(--accent); border-radius: 6px;
  background: rgba(15,20,36,.6);
}
.action-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.action-foot label { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-dim); }
.input.mini { width: 76px; padding: 4px 6px; min-height: 0; }
.input.code { font-family: 'Courier New', monospace; font-size: 12px; white-space: pre; }
.mini-list { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
.mini-chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px;
  background: var(--border); border-radius: 999px; font-size: 11px;
}
.mini-chip button { border: none; background: none; color: var(--text-dim); cursor: pointer; }

/* ── Lienzo ─────────────────────────────────────────── */

#stage-area {
  position: relative; flex: 1; min-width: 0;
  display: grid;
  grid-template: 24px 1fr / 24px 1fr;
}
#ruler-corner { background: var(--panel); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); z-index: 3; }
#ruler-h-wrap { overflow: hidden; border-bottom: 1px solid var(--border); z-index: 2; }
#ruler-v-wrap { overflow: hidden; border-right: 1px solid var(--border); z-index: 2; }
#ruler-h, #ruler-v { display: block; }

#viewport {
  position: relative; overflow: hidden; touch-action: none;
  grid-row: 2; grid-column: 2; /* posición explícita: no depende de las reglas */
  background:
    radial-gradient(circle at 25% 8%, rgba(255,55,95,.07), transparent 42%),
    radial-gradient(circle at 80% 90%, rgba(175,82,222,.06), transparent 45%),
    var(--bg);
  cursor: default;
}
#viewport.panning { cursor: grab; }

#world { position: absolute; top: 0; left: 0; transform-origin: 0 0; --izoom: 1; }

#artboard {
  position: absolute; top: 0; left: 0;
  background: #0b1020;
  box-shadow: 0 0 0 1px var(--border), 0 30px 80px rgba(0,0,0,.55);
  overflow: hidden;
}
#artboard.show-grid {
  background-image:
    linear-gradient(rgba(148,163,184,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148,163,184,.06) 1px, transparent 1px);
  background-size: var(--grid-size, 8px) var(--grid-size, 8px);
}

#guides { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; z-index: 40; }
#guides line { stroke: #f472b6; stroke-width: calc(1px * var(--izoom, 1)); stroke-dasharray: 4 3; }

#draw-layer { position: absolute; top: 0; left: 0; z-index: 50; pointer-events: none; touch-action: none; }
#draw-layer.active { pointer-events: auto; cursor: crosshair; }

#overlay { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 60; }

/* Nodos dentro del artboard — overrides SOLO del editor.
   (El CSS de componentes viene de componentStyles.js, compartido
   con el export; #artboard da la especificidad para ganar aquí.) */
#artboard .wb-node { user-select: none; }
#artboard .wb-node .wb-text { outline: none; }
#artboard .wb-btn, #artboard .wb-heartbtn, #artboard .wb-nav { cursor: default; pointer-events: none; }
#artboard .wb-embed iframe { pointer-events: none; } /* editable como objeto */
#artboard .wb-form input, #artboard .wb-form textarea, #artboard .wb-form button { pointer-events: none; }
#artboard .wb-menu a { pointer-events: none; }
#artboard .wb-letter, #artboard .wb-hiddenmsg { cursor: default; }
.wb-tag-label {
  position: absolute; top: 4px; left: 6px; font-size: 10px; color: rgba(148,163,184,.6);
  pointer-events: none;
}
.wb-3d-loading {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 100%; height: 100%; color: #64748b; text-align: center; gap: 6px;
  background: radial-gradient(circle, rgba(99,102,241,.12), transparent 70%);
  border-radius: inherit; font-size: 22px;
}
.wb-3d-loading small { font-size: 11px; }
#artboard .wb-node.locked { outline: 1px dashed rgba(148,163,184,.4); }
.wb-typewriter-static { display: block; width: 100%; height: 100%; }

/* ── Selección y tiradores ──────────────────────────── */

.sel-box {
  position: absolute; pointer-events: none;
  outline: calc(1.5px * var(--izoom, 1)) solid var(--accent-2);
}
.sel-box.locked { outline-style: dashed; }
.handle {
  position: absolute; width: 10px; height: 10px;
  background: #fff; border: 1.5px solid var(--accent);
  border-radius: 3px; pointer-events: auto;
  transform: translate(-50%, -50%) scale(var(--izoom, 1));
}
.h-nw { top: 0; left: 0; cursor: nwse-resize; }
.h-n  { top: 0; left: 50%; cursor: ns-resize; }
.h-ne { top: 0; left: 100%; cursor: nesw-resize; }
.h-e  { top: 50%; left: 100%; cursor: ew-resize; }
.h-se { top: 100%; left: 100%; cursor: nwse-resize; }
.h-s  { top: 100%; left: 50%; cursor: ns-resize; }
.h-sw { top: 100%; left: 0; cursor: nesw-resize; }
.h-w  { top: 50%; left: 0; cursor: ew-resize; }
.h-rotate {
  top: -22px; left: 50%; border-radius: 50%; cursor: grab;
  background: var(--accent); border-color: #fff;
}
.sel-label {
  position: absolute; bottom: 100%; left: 0; margin-bottom: 26px;
  padding: 2px 7px; background: var(--accent); color: #fff;
  border-radius: 5px; font-size: 11px; white-space: nowrap;
  transform: scale(var(--izoom, 1)); transform-origin: bottom left;
}

#marquee {
  position: absolute; border: 1px solid var(--accent-2);
  background: rgba(99,102,241,.12); pointer-events: none; z-index: 70;
}

/* ── Barra de dibujo ────────────────────────────────── */

.draw-toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 12px; background: var(--panel-2); border-bottom: 1px solid var(--border);
}
.draw-toolbar label { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 12px; }
.draw-toolbar input[type="color"] { width: 30px; height: 30px; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: none; }

/* ── Modo vista previa ──────────────────────────────── */

body.preview #left-panel,
body.preview #right-panel,
body.preview #overlay,
body.preview #ruler-h-wrap,
body.preview #ruler-v-wrap,
body.preview #ruler-corner { display: none; }
body.preview #stage-area { grid-template: 0 1fr / 0 1fr; }
body.preview .wb-btn, body.preview .wb-menu a, body.preview .wb-form input,
body.preview .wb-form textarea, body.preview .wb-form button,
body.preview .wb-nav, body.preview .wb-heartbtn { pointer-events: auto; cursor: pointer; }
body.preview .wb-embed iframe { pointer-events: auto; }
body.preview .wb-node { user-select: text; }
body.preview .wb-placeholder { opacity: .25; }

/* ── Pestaña de Música ──────────────────────────────── */

.music-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.music-row {
  display: flex; align-items: center; gap: 10px; padding: 10px;
  background: var(--panel-2); border: .5px solid var(--border); border-radius: 16px;
}
.music-play {
  width: 40px; height: 40px; flex: none; border: none; border-radius: 50%;
  background: var(--grad); color: #fff; font-size: 15px; cursor: pointer;
  box-shadow: 0 4px 14px rgba(255,143,171,.4);
  transition: transform .15s;
}
.music-play:active { transform: scale(.9); }
.music-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.music-meta strong { font-size: 13px; }
.music-meta span { font-size: 11px; color: var(--text-dim); }
.music-meta small { font-size: 10px; color: var(--text-dim); opacity: .7; font-family: monospace; }
.mini-select { width: auto; min-height: 0; padding: 5px 8px; font-size: 12px; }

/* ── Swatches de gradientes ─────────────────────────── */

.swatch-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.swatch {
  width: 26px; height: 26px; border: 1px solid var(--border);
  border-radius: 7px; cursor: pointer; padding: 0;
}
.swatch:hover { border-color: #fff; transform: scale(1.12); }

/* ── FAB One UI (añadir con el pulgar) ──────────────── */

#fab-add {
  display: none;
  position: fixed; right: 16px; bottom: 130px; z-index: 95;
  width: 58px; height: 58px; border: none; border-radius: 50%;
  background: var(--grad); color: #fff; font-size: 28px; line-height: 1;
  box-shadow: 0 10px 28px rgba(255, 143, 171, .5), 0 2px 8px rgba(0,0,0,.35);
  cursor: pointer;
  transition: transform .2s cubic-bezier(.2,.8,.25,1), box-shadow .2s;
}
#fab-add:active { transform: scale(.88) rotate(45deg); }
body.preview #fab-add { display: none !important; }

/* ── Barra de navegación móvil ──────────────────────── */

#mobile-nav {
  display: none;
  position: fixed; left: 0; right: 0; bottom: 0; height: 58px;
  background: var(--panel);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-top: .5px solid var(--border);
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
#mobile-nav button {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; background: none; border: none; color: var(--text-dim); cursor: pointer;
}
#mobile-nav button.active { color: var(--accent); }
#mobile-nav .mn-icon { font-size: 19px; line-height: 1; }
#mobile-nav .mn-label { font-size: 10px; }

/* ── Rediseño MÓVIL (Android / iOS) ─────────────────── */

@media (max-width: 820px) {
  /* Los paneles se convierten en hojas deslizantes estilo iOS:
     el lienzo ocupa TODA la pantalla y el zoom de ajuste es correcto. */
  #left-panel, #right-panel {
    position: fixed; left: 0; right: 0; bottom: 58px; top: auto;
    width: 100%; max-height: 56vh;
    border: none; border-top: .5px solid var(--border);
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -14px 44px rgba(0, 0, 0, .6);
    transform: translateY(115%);
    transition: transform .32s cubic-bezier(.2, .9, .25, 1);
    z-index: 90;
    padding-bottom: 10px;
  }
  /* Asa de arrastre iOS */
  #left-panel::before, #right-panel::before {
    content: ''; display: block; width: 38px; height: 5px; border-radius: 3px;
    background: rgba(152,152,159,.4); margin: 8px auto 2px; flex: none;
  }
  #left-panel.open, #right-panel.open { transform: none; }

  #mobile-nav { display: flex; }
  #fab-add { display: block; }

  /* One UI: superficies más redondeadas y respirables en móvil */
  :root { --radius: 18px; }
  .props-section { border-radius: 18px; }
  .palette-item, .block-item, .music-row { border-radius: 18px; }
  .asset-card { border-radius: 16px; }

  /* Sin reglas en pantallas pequeñas: más lienzo */
  #stage-area { grid-template: 0 1fr / 0 1fr; }
  #ruler-corner, #ruler-h-wrap, #ruler-v-wrap { display: none; }

  #workspace { padding-bottom: 58px; }

  /* Topbar compacta, desplazable y con objetivos táctiles amplios */
  #topbar { height: 52px; gap: 5px; }
  .btn, .seg-btn { padding: 9px 11px; min-height: 38px; }
  .brand { font-size: 13px; }

  /* Controles más grandes en paneles */

  // src/storage/db.js
  var DB_NAME = "nocode-builder";
  var DB_VERSION = 1;
  var STORE_ASSETS = "assets";
  var STORE_PROJECTS = "projects";
  var dbPromise = null;
  function open() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE_ASSETS)) db.createObjectStore(STORE_ASSETS, { keyPath: "id" });
        if (!db.objectStoreNames.contains(STORE_PROJECTS)) db.createObjectStore(STORE_PROJECTS, { keyPath: "id" });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }
  function tx(storeName, mode, fn) {
    return open().then((db) => new Promise((resolve, reject) => {
      const t = db.transaction(storeName, mode);
      const store = t.objectStore(storeName);
      const result = fn(store);
      t.oncomplete = () => resolve(result?.result ?? result);
      t.onerror = () => reject(t.error);
    }));
  }
  var DB = {
    /** Guarda registro de asset { id, name, kind, mime, size, folder, tags, data(dataURL) } */
    putAsset: (asset2) => tx(STORE_ASSETS, "readwrite", (s) => s.put(asset2)),
    deleteAsset: (id) => tx(STORE_ASSETS, "readwrite", (s) => s.delete(id)),
    getAllAssets: () => tx(STORE_ASSETS, "readonly", (s) => s.getAll()),
    putProject: (project) => tx(STORE_PROJECTS, "readwrite", (s) => s.put(project)),
    getProject: (id) => tx(STORE_PROJECTS, "readonly", (s) => s.get(id))
  };

  var LS_KEY = "nocode-builder:project";

  var ProjectStore = class _ProjectStore extends EventBus {
    project = null;

    #autosave = debounce(() => this.persist(), 800);
    /* ── Ciclo de vida ─────────────────────────────────── */
    async init() {
      const saved = localStorage.getItem(LS_KEY);
      if (saved) {
        try {
          this.project = JSON.parse(saved);
        } catch {
          this.project = null;
        }
      }
      if (!this.project || !Object.keys(this.project.nodes || {}).length) {

      this.pageId = this.project.pages[0].id;
    }
    static blankProject() {
      const pageId = uid("pg");
      return {
        version: 1,
        meta: { name: "Mi Proyecto", created: Date.now(), modified: Date.now() },
        settings: {
          breakpoints: { desktop: 1280, tablet: 768, mobile: 390 },

        },
        pages: [{ id: pageId, name: "Inicio", slug: "index", height: 800, background: "#0b1020", transition: "fade", nodes: [] }],
        nodes: {},
        assets: []
      };
    }
    /** Migra proyectos de versiones anteriores al modelo actual. */
    migrate(project) {
      project.custom ||= { css: "", js: "" };
      for (const page of project.pages) {
        page.transitionDuration ||= 700;
        page.custom ||= { css: "", js: "" };
      }
      for (const node2 of Object.values(project.nodes)) {
        node2.effects ||= { parallax: 0, tilt: false };
        node2.effects.press ||= "ninguno";
        node2.effects.hoverFx ||= "ninguno";
        node2.animationOut ||= { preset: "fadeOut", duration: 450, easing: "ease-in" };
        node2.animation.custom ||= "";
        node2.events = (node2.events || []).map((ev) => ev.actions ? ev : { on: ev.on || "click", actions: [{ action: ev.action, target: ev.target || "", value: "", delay: 0 }] });
      }
    }
    persist() {
      this.project.meta.modified = Date.now();
      try {
        localStorage.setItem(LS_KEY, JSON.stringify(this.project));
      } catch (e) {
        console.warn("localStorage lleno; usando solo IndexedDB", e);
      }
      DB.putProject({ id: "current", data: this.project }).catch(console.warn);
      this.emit("saved");
    }
    /* ── Historial ─────────────────────────────────────── */
    snapshot() {
      this.#history.push(deepClone(this.project));
      if (this.#history.length > HISTORY_LIMIT) this.#history.shift();

.wb-polaroid{width:100%;height:100%;background:#fdf6ec;padding:5% 5% 0;border-radius:4px;box-shadow:0 12px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;transform:rotate(var(--prot,-2deg));transition:transform .3s}
.wb-polaroid:hover{transform:rotate(0) scale(1.03)}
.wb-polaroid img{width:100%;flex:1;object-fit:cover;min-height:0}
.wb-polaroid figcaption{padding:10px 4px;text-align:center;font-family:Georgia,serif;font-style:italic;color:#57534e;font-size:.95em}
.wb-polaroid .wb-placeholder{flex:1}

/* \u2500\u2500 Emojis flotantes \u2500\u2500 */
.wb-floaties{position:relative;width:100%;height:100%;overflow:hidden;pointer-events:none;border-radius:inherit}
.wb-floaties span{position:absolute;bottom:-40px;animation:wb-floatup linear infinite}
@keyframes wb-floatup{0%{transform:translateY(0) rotate(-8deg);opacity:0}10%{opacity:1}90%{opacity:.9}100%{transform:translateY(-110vh) rotate(10deg);opacity:0}}

/* \u2500\u2500 Componente personalizado \u2500\u2500 */
.wb-custom{width:100%;height:100%;border-radius:inherit;overflow:hidden}

/* \u2500\u2500 Letras animadas \u2500\u2500 */
.wb-fx{display:inline-block}
.wb-fx-olas{animation:wb-fxwave 1.8s ease-in-out infinite;animation-delay:calc(var(--i)*90ms)}
@keyframes wb-fxwave{0%,100%{transform:translateY(0)}50%{transform:translateY(-.35em)}}
.wb-fx-saltos{animation:wb-fxjump 1.4s cubic-bezier(.3,1.6,.4,1) infinite;animation-delay:calc(var(--i)*70ms)}
@keyframes wb-fxjump{0%,30%,100%{transform:translateY(0) scale(1)}15%{transform:translateY(-.5em) scale(1.15)}}
.wb-fx-brillo{animation:wb-fxglow 2.2s ease-in-out infinite;animation-delay:calc(var(--i)*110ms)}
@keyframes wb-fxglow{0%,100%{text-shadow:0 0 4px rgba(255,255,255,.1);opacity:.8}50%{text-shadow:0 0 16px rgba(255,220,255,.95),0 0 34px rgba(244,114,182,.7);opacity:1}}
.wb-fx-arcoiris{animation:wb-fxrainbow 3.2s linear infinite;animation-delay:calc(var(--i)*-140ms)}
@keyframes wb-fxrainbow{0%{color:#f472b6}20%{color:#fb923c}40%{color:#facc15}60%{color:#4ade80}80%{color:#38bdf8}100%{color:#f472b6}}

/* \u2500\u2500 Micro-interacciones: todo responde al tacto \u2500\u2500 */
.wb-btn,.wb-heartbtn,.wb-form button{transition:transform .18s cubic-bezier(.2,.8,.25,1),filter .18s}
.wb-btn:hover,.wb-form button:hover{transform:scale(1.035);filter:brightness(1.1)}
.wb-btn:active,.wb-form button:active{transform:scale(.94)}
.wb-node img{transition:transform .35s cubic-bezier(.2,.8,.25,1)}
.wb-gallery img:hover,.wb-slider:hover .wb-slide.active{transform:scale(1.04)}
.wb-menu a{transition:opacity .15s,transform .15s}
.wb-menu a:active{transform:scale(.93)}

/* \u2500\u2500 Biblioteca de efectos de PRESI\xD3N (data-press) \u2500\u2500 */
[data-press]{transition:transform .16s cubic-bezier(.2,.8,.25,1),filter .16s,box-shadow .16s}
[data-press="escala"].wb-pressing{transform:scale(.93)!important}
[data-press="rebote"].wb-pressing{animation:wb-pressbounce .45s cubic-bezier(.3,1.8,.4,1)!important}
@keyframes wb-pressbounce{0%{transform:scale(1)}35%{transform:scale(.85)}70%{transform:scale(1.06)}100%{transform:scale(1)}}
[data-press="brillo"].wb-pressing{filter:brightness(1.5) drop-shadow(0 0 14px rgba(255,155,184,.9))!important}
[data-press="latido"].wb-pressing{animation:wb-latido-fx .5s ease!important}
@keyframes wb-latido-fx{0%,100%{transform:scale(1)}30%{transform:scale(1.12)}60%{transform:scale(.96)}}
[data-press="sacudida"].wb-pressing{animation:wb-shake-fx .4s ease!important}
@keyframes wb-shake-fx{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
[data-press="hundir"].wb-pressing{transform:scale(.96) translateY(3px)!important;filter:brightness(.85)}

/* \u2500\u2500 Efectos al pasar el cursor (data-hover) \u2500\u2500 */
[data-hover]{transition:transform .25s cubic-bezier(.2,.8,.25,1),filter .25s,box-shadow .25s}
[data-hover="elevar"]:hover{transform:translateY(-6px);box-shadow:0 18px 44px rgba(0,0,0,.4)}
[data-hover="zoom"]:hover{transform:scale(1.05)}
[data-hover="brillo"]:hover{filter:brightness(1.25) drop-shadow(0 0 16px rgba(255,155,184,.7))}
[data-hover="flotar"]:hover{animation:wb-float 1.8s ease-in-out infinite}
[data-hover="girar"]:hover{transform:rotate(3deg) scale(1.03)}

/* \u2500\u2500 Bot\xF3n de navegaci\xF3n (variantes) \u2500\u2500 */
.wb-nav{width:100%;height:100%;border:none;cursor:pointer;font:inherit;color:inherit;background:inherit;border-radius:inherit;display:flex;align-items:center;justify-content:center;gap:8px;text-shadow:inherit}
.wb-nav .wb-nav-arrow{font-size:1.25em;line-height:1;animation:wb-navnudge 1.6s ease-in-out infinite}
.wb-nav[data-dir="prev"] .wb-nav-arrow{animation-name:wb-navnudge-prev}
@keyframes wb-navnudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes wb-navnudge-prev{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}
.wb-nav-burbuja{border-radius:50%!important}

/* \u2500\u2500 Mensaje flotante (acci\xF3n showMessage) \u2500\u2500 */
.wb-toast{position:fixed;left:50%;bottom:9%;transform:translateX(-50%) translateY(20px);z-index:9999;
  max-width:82vw;padding:14px 24px;border-radius:22px;background:rgba(28,28,30,.86);color:#fff;
  font:600 16px/1.4 -apple-system,system-ui,sans-serif;text-align:center;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 12px 40px rgba(0,0,0,.45),0 0 0 .5px rgba(255,255,255,.12);
  animation:wb-toast-in .45s cubic-bezier(.2,.8,.25,1) both;pointer-events:none}
.wb-toast.out{animation:wb-toast-out .6s ease both}
@keyframes wb-toast-in{from{opacity:0;transform:translateX(-50%) translateY(26px) scale(.9)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes wb-toast-out{to{opacity:0;transform:translateX(-50%) translateY(14px) scale(.94)}}

/* \u2500\u2500 Placeholders (editor y export degradado) \u2500\u2500 */
.wb-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;height:100%;border:2px dashed #334155;border-radius:inherit;color:#64748b;font-weight:600;text-align:center;padding:8px;font-size:14px}
.wb-placeholder small{font-weight:400;font-size:11px}

/* \u2500\u2500 Transiciones de p\xE1gina \u2500\u2500 */
@keyframes wb-page-fade{from{opacity:0}to{opacity:1}}
@keyframes wb-page-slide{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes wb-page-zoom{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes wb-page-blur{from{opacity:0;filter:blur(16px)}to{opacity:1;filter:blur(0)}}
@keyframes wb-page-circulo{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(140% at 50% 50%)}}
@keyframes wb-page-cortina{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes wb-page-giro3d{from{opacity:0;transform:perspective(1100px) rotateY(-24deg) scale(.94)}to{opacity:1;transform:perspective(1100px) rotateY(0) scale(1)}}
@keyframes wb-page-ascenso{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
.wb-enter-fade{animation:wb-page-fade var(--tdur,.6s) ease-out both}
.wb-enter-slide{animation:wb-page-slide var(--tdur,.6s) ease-out both}
.wb-enter-zoom{animation:wb-page-zoom var(--tdur,.6s) ease-out both}
.wb-enter-blur{animation:wb-page-blur var(--tdur,.7s) ease-out both}
.wb-enter-circulo{animation:wb-page-circulo var(--tdur,.9s) ease-in-out both}
.wb-enter-cortina{animation:wb-page-cortina var(--tdur,.8s) cubic-bezier(.7,0,.2,1) both}
.wb-enter-giro3d{animation:wb-page-giro3d var(--tdur,.8s) cubic-bezier(.2,.8,.25,1) both}
.wb-enter-ascenso{animation:wb-page-ascenso var(--tdur,.7s) cubic-bezier(.2,.8,.25,1) both}
.wb-enter-corazones,.wb-enter-estrellas,.wb-enter-nieve{animation:wb-page-fade var(--tdur,.8s) ease-out both}
.wb-transition-overlay{position:fixed;inset:0;z-index:9998;pointer-events:none}

        const dx = point.x - g.start.x, dy = point.y - g.start.y;
        const f = { ...g.frame };
        const h = g.handle;
        if (h.includes("e")) f.w = Math.max(16, g.frame.w + dx);
        if (h.includes("s")) f.h = Math.max(16, g.frame.h + dy);
        if (h.includes("w")) {
          f.w = Math.max(16, g.frame.w - dx);
          f.x = g.frame.x + g.frame.w - f.w;
        }
        if (h.includes("n")) {
          f.h = Math.max(16, g.frame.h - dy);
          f.y = g.frame.y + g.frame.h - f.h;
        }
        if (e.shiftKey && g.frame.w && g.frame.h) {
          const ratio = g.frame.w / g.frame.h;
          if (h.includes("e") || h.includes("w")) f.h = f.w / ratio;
          else f.w = f.h * ratio;
        }
        this.store.setFrame(g.node, { x: Math.round(f.x), y: Math.round(f.y), w: Math.round(f.w), h: Math.round(f.h) });
        const elem = this.#nodeEl(g.node.id);
        if (elem) syncNodeEl(elem, g.node, this.store);
        this.updateOverlay();
        return;
      }
      if (g.kind === "rotate") {
        const angle = Math.atan2(e.clientY - g.cy, e.clientX - g.cx);
        let deg = g.startRotation + (angle - g.startAngle) * 180 / Math.PI;
        if (e.shiftKey) deg = Math.round(deg / 15) * 15;
        this.store.setFrame(g.node, { rotation: Math.round(deg) });
        const elem = this.#nodeEl(g.node.id);
        if (elem) syncNodeEl(elem, g.node, this.store);
        this.updateOverlay();
      }
    }
    /* ── Fin de gesto ──────────────────────────────────── */
    #onUp(e) {
      this.pointers.delete(e.pointerId);
      const g = this.gesture;
      if (!g) return;
      if (g.kind === "pinch" && this.pointers.size > 0) return;
      this.gesture = null;
      this.view.clearGuides();
      document.getElementById("marquee")?.remove();
      if (g.kind === "marquee" && g.x1 != null) {
        const [x0, x1] = [Math.min(g.x0, g.x1), Math.max(g.x0, g.x1)];
        const [y0, y1] = [Math.min(g.y0, g.y1), Math.max(g.y0, g.y1)];
        const hits = this.store.pageNodes().filter((n) => {
          const f = this.store.frame(n);
          return f.x < x1 && f.x + f.w > x0 && f.y < y1 && f.y + f.h > y0;
        }).map((n) => n.id);
        if (hits.length) this.store.select(hits, g.additive);
      }
      if (g.kind === "move" && g.moved || g.kind === "resize" || g.kind === "rotate") {
        const bottom = this.store.selectedNodes.reduce((max, n) => {
          const f = this.store.frame(n);
          return Math.max(max, f.y + f.h);
        }, 0);
        if (bottom > this.store.page.height) this.store.page.height = Math.ceil(bottom + 160);
        this.store.commit();
        if (e.pointerType === "touch" && navigator.vibrate) navigator.vibrate(12);
      }
    }
    #onWheel(e) {
      e.preventDefault();
      if (e.ctrlKey || e.metaKey) this.view.zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.1 : 0.9);
      else this.store.setView(null, { x: this.store.pan.x - e.deltaX, y: this.store.pan.y - e.deltaY });
    }
    /* ── Edición inline de texto ───────────────────────── */
    #onDblClick(e) {
      if (document.body.classList.contains("preview")) return;
      const nodeEl = e.target.closest(".wb-node");
      if (!nodeEl) return;
      const node2 = this.store.node(nodeEl.dataset.id);
      if (!node2 || node2.locked || !["text", "button"].includes(node2.type)) return;
      const target = nodeEl.querySelector(".wb-text, .wb-btn") || nodeEl;
      target.contentEditable = "plaintext-only";
      target.focus();
      document.getSelection()?.selectAllChildren(target);
      const finish = () => {
        target.contentEditable = "false";
        this.store.snapshot();
        this.store.updateNode(node2.id, "props", { text: target.innerText.trim() });
      };
      target.addEventListener("blur", finish, { once: true });
      target.addEventListener("keydown", (ev) => {
        if (ev.key === "Escape") target.blur();
        ev.stopPropagation();
      });
    }
    /* ── Snap a guías y rejilla ────────────────────────── */
    #snap(x, y, w, h, excludeIds) {
      const lines = [];
      let dx = 0, dy = 0;
      const threshold = SNAP_THRESHOLD / this.store.zoom;
      const width = this.store.project.settings.breakpoints[this.store.device];
      const height = this.store.page.height;
      const candidatesV = [0, width / 2, width];
      const candidatesH = [0, height / 2, height];
      for (const other of this.store.pageNodes()) {
        if (excludeIds.includes(other.id) || other.hidden) continue;
        const f = this.store.frame(other);
        candidatesV.push(f.x, f.x + f.w / 2, f.x + f.w);
        candidatesH.push(f.y, f.y + f.h / 2, f.y + f.h);
      }
      const edgesV = [x, x + w / 2, x + w];
      const edgesH = [y, y + h / 2, y + h];
      outer_v:
        for (const candidate of candidatesV) {
          for (const edge of edgesV) {
            if (Math.abs(edge - candidate) < threshold) {
              dx = candidate - edge;
              lines.push({ axis: "v", pos: candidate });
              break outer_v;
            }
          }
        }
      outer_h:
        for (const candidate of candidatesH) {
          for (const edge of edgesH) {
            if (Math.abs(edge - candidate) < threshold) {
              dy = candidate - edge;
              lines.push({ axis: "h", pos: candidate });
              break outer_h;
            }
          }
        }
      const grid = this.store.project.settings.grid;
      if (grid.snap) {
        if (!dx) dx = Math.round((x + dx) / grid.size) * grid.size - x;
        if (!dy) dy = Math.round((y + dy) / grid.size) * grid.size - y;
      }
      return { dx, dy, lines };
    }
    /* ── Overlay de selección ──────────────────────────── */
    #nodeEl(id) {
      return this.view.artboard.querySelector(`[data-id="${id}"]`);
    }
    #renderMarquee(g) {
      let box = document.getElementById("marquee");
      if (!box) {
        box = document.createElement("div");
        box.id = "marquee";
        this.view.overlay.append(box);
      }
      box.style.left = `${Math.min(g.x0, g.x1)}px`;
      box.style.top = `${Math.min(g.y0, g.y1)}px`;
      box.style.width = `${Math.abs(g.x1 - g.x0)}px`;
      box.style.height = `${Math.abs(g.y1 - g.y0)}px`;
    }
    #renderOverlay() {
      const overlay = this.view.overlay;
      const marquee = document.getElementById("marquee");
      overlay.innerHTML = "";
      if (marquee) overlay.append(marquee);
      const selected = this.store.selectedNodes;
      const single = selected.length === 1;
      for (const node2 of selected) {
        const f = this.store.frame(node2);
        const box = document.createElement("div");
        box.className = `sel-box${node2.locked ? " locked" : ""}`;
        Object.assign(box.style, {
          left: `${f.x}px`,
          top: `${f.y}px`,
          width: `${f.w}px`,
          height: `${f.h}px`,
          transform: `rotate(${f.rotation || 0}deg)`
        });
        if (single && !node2.locked) {
          for (const h of ["nw", "n", "ne", "e", "se", "s", "sw", "w"]) {
            const handle = document.createElement("div");
            handle.className = `handle h-${h}`;
            handle.dataset.handle = h;
            box.append(handle);
          }
          const rot = document.createElement("div");
          rot.className = "handle h-rotate";
          rot.dataset.handle = "rotate";
          box.append(rot);
          const label = document.createElement("div");
          label.className = "sel-label";
          label.textContent = `${node2.name} \xB7 ${Math.round(f.w)}\xD7${Math.round(f.h)}`;
          box.append(label);
        }
        overlay.append(box);
      }
    }
  };

  // src/config/musicLibrary.js
  var MUSIC_REPO_BASE = "https://raw.githubusercontent.com/TU_USUARIO/TU_REPO/main/musica/";

    { file: "musica3.mp3", title: "Para dedicarte", artist: "Con todo mi amor" }

  function trackURL(track) {
    return MUSIC_REPO_BASE + encodeURIComponent(track.file);
  }

  // src/editor/panels.js

    #renderAssetGrid() {

        grid.append(el("p", { class: "panel-hint", text: "Sin assets todav\xEDa. Sube im\xE1genes, GIFs, v\xEDdeos, audio o modelos GLB." }));

      }
      for (const asset2 of list) {
        const preview = asset2.kind === "video" ? el("video", { src: asset2.data, muted: "true", class: "asset-thumb" }) : ["image", "gif", "svg"].includes(asset2.kind) ? el("img", { src: asset2.data, class: "asset-thumb", draggable: "false" }) : el("div", { class: "asset-thumb kind-icon", text: ASSET_KINDS[asset2.kind].icon });
        const card = el("div", {

    #useAsset(asset2, at = null) {
      const sel = this.store.selectedNodes[0];
      const def = sel && Components[sel.type];
      if (!at && sel && def?.accepts?.includes(asset2.kind === "svg" ? "image" : asset2.kind)) {
        if (def.schema.some((f) => f.key === "props.assetIds")) {
          this.store.updateNode(sel.id, "props", { assetIds: [...sel.props.assetIds || [], asset2.id] });
        } else {
          this.store.updateNode(sel.id, "props", { assetId: asset2.id });
        }
        return;
      }
      const type = this.assets.componentForAsset(asset2);
      if (!type) return;
      const width = this.store.project.settings.breakpoints[this.store.device];
      this.store.addNode(type, at || { x: Math.round(width / 2 - 160), y: 120 }, { props: { ...Components[type].defaults.props, assetId: asset2.id } });
    }

    /* ── Drop sobre el lienzo (componentes, assets, archivos del SO) ── */
    #setupCanvasDrop() {

      vp.addEventListener("dragover", (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
      });
      vp.addEventListener("drop", async (e) => {
        e.preventDefault();
        const at = this.view.toArtboard(e.clientX, e.clientY);
        const type = e.dataTransfer.getData("application/x-wb-component");
        if (type) {
          const def = Components[type];
          this.store.addNode(type, { x: Math.round(at.x - def.size[0] / 2), y: Math.round(at.y - def.size[1] / 2) });
          return;
        }
        const assetId = e.dataTransfer.getData("application/x-wb-asset");
        if (assetId) {
          const asset2 = this.assets.get(assetId);
          if (asset2) this.#useAsset(asset2, { x: Math.round(at.x - 140), y: Math.round(at.y - 100) });
          return;
        }
        if (e.dataTransfer.files?.length) {
          const imported = await this.assets.importFiles([...e.dataTransfer.files]);
          let offset = 0;
          for (const asset2 of imported) {
            this.#useAsset(asset2, { x: Math.round(at.x - 140 + offset), y: Math.round(at.y - 100 + offset) });

    #renderSchemaField(node2, field) {
      const value = getPath(node2, field.key);
      const commit = (v) => {
        this.store.snapshot();
        const [section, ...rest] = field.key.split(".");
        const patch = {};
        if (rest.length === 1) patch[rest[0]] = v;
        else setPath(patch, rest.join("."), v);
        this.store.updateNode(node2.id, section, patch);
      };
      switch (field.type) {
        case "text":
          return this.#field(field.label, el("input", { class: "input", value: value ?? "", onchange: (e) => commit(e.target.value) }));
        case "textarea":
          return this.#field(field.label, el("textarea", { class: "input", rows: 3, text: value ?? "", onchange: (e) => commit(e.target.value) }));
        case "number":
          return this.#field(field.label, el("input", {
            class: "input",
            type: "number",
            value: value ?? 0,
            min: field.min,
            max: field.max,
            step: field.step ?? 1,
            onchange: (e) => commit(+e.target.value)
          }));
        case "color": {
          const isHex = /^#[0-9a-f]{3,8}$/i.test(value || "");
          const controls = [el("div", { class: "color-field" }, [
            el("input", { type: "color", value: isHex ? value : "#6366f1", oninput: (e) => commit(e.target.value) }),
            el("input", { class: "input", value: value ?? "", placeholder: "color / gradiente CSS", onchange: (e) => commit(e.target.value) })
          ])];
          if (/background/i.test(field.key)) {
            controls.push(el("div", { class: "swatch-row" }, GRADIENT_SWATCHES.map((g) => el("button", { class: "swatch", title: g, style: { background: g }, onclick: () => commit(g) }))));
          }
          return this.#field(field.label, el("div", {}, controls));
        }
        case "select":
          return this.#field(field.label, this.#select(field.options, value, commit));
        case "navTarget": {
          const opts = ["__next", "__prev", ...this.store.project.pages.map((p) => p.id)];
          return this.#field(field.label, this.#select(
            opts,
            value || "__next",
            commit,
            (id) => id === "__next" ? "\u2192 P\xE1gina siguiente" : id === "__prev" ? "\u2190 P\xE1gina anterior" : this.store.project.pages.find((p) => p.id === id)?.name || id
          ));
        }
        case "font": {
          const customFonts = this.assets.list({ kind: "font" }).map((a) => this.assets.fontName(a));
          return this.#field(field.label, this.#select([...FONTS, ...customFonts], value || "system-ui", commit));
        }
        case "checkbox":
          return this.#check(field.label, !!value, commit);
        case "asset": {
          const list = this.assets.list({ kind: field.kind });
          const options = [{ id: "", name: "\u2014 ninguno \u2014" }, ...list];
          return this.#field(field.label, el("select", {
            class: "input",
            onchange: (e) => commit(e.target.value || null)
          }, options.map((a) => el("option", { value: a.id, text: a.name, selected: (value || "") === a.id ? "true" : null }))));
        }
        case "assetList": {
          const ids = value || [];
          const list = this.assets.list({ kind: field.kind });
          return this.#field(field.label, el("div", {}, [
            el("div", { class: "mini-list" }, ids.map((id, i) => el("span", { class: "mini-chip" }, [
              this.assets.get(id)?.name || "?",
              el("button", { text: "\xD7", onclick: () => commit(ids.filter((_, j) => j !== i)) })
            ]))),
            el("select", {
              class: "input",
              onchange: (e) => {
                if (e.target.value) commit([...ids, e.target.value]);
                e.target.value = "";
              }
            }, [el("option", { value: "", text: "+ a\xF1adir imagen\u2026" }), ...list.map((a) => el("option", { value: a.id, text: a.name }))])
          ]));
        }
        default:
          return null;
      }
    }
    #renderEventRow(node2, event, index) {
      const commit = () => {
        this.store.commit();
      };
      const snap = () => {
        this.store.snapshot();
      };
      const actionRow = (action, ai) => {
        const def = EVENT_ACTIONS[action.action] || EVENT_ACTIONS.burstHearts;
        const controls = [
          this.#select(
            Object.keys(EVENT_ACTIONS),
            action.action,
            (v) => {
              snap();
              action.action = v;
              action.target = "";
              action.value = "";
              commit();
            },
            (k) => EVENT_ACTIONS[k].label
          )
        ];
        if (def.targetKind === "page") {
          const pageOpts = ["__next", "__prev", ...this.store.project.pages.map((p) => p.id)];
          controls.push(this.#select(
            pageOpts,
            action.target,
            (v) => {

          pa.setZ(i, -(px * px + py * py) * 0.16 * depth);
        }
        geo.computeVertexNormals();
        pivot.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85 })));
      });
      elem.addEventListener('pointermove', function (e) {
        var r = elem.getBoundingClientRect();
        pivot.rotation.y = ((e.clientX - r.left) / r.width - 0.5) * 0.55 * depth;
        pivot.rotation.x = ((e.clientY - r.top) / r.height - 0.5) * -0.45 * depth;
      });
      camera.position.z = 2.6;
    } else {
      var src = elem.getAttribute('data-model');
      var demo = function () {
        pivot.add(new THREE.Mesh(new THREE.TorusKnotGeometry(0.8, 0.28, 128, 24),
          new THREE.MeshStandardMaterial({ color: 0x818cf8, metalness: 0.6, roughness: 0.25 })));
      };
      if (src) {
        new GLTFLoader().load(src, function (gltf) {
          var model = gltf.scene;
          var box = new THREE.Box3().setFromObject(model);
          var size = box.getSize(new THREE.Vector3());
          var scale = 2 / Math.max(size.x, size.y, size.z, 0.001);
          model.scale.setScalar(scale);
          box.getCenter(size); model.position.sub(size.multiplyScalar(scale));
          pivot.add(model);
          if (elem.getAttribute('data-playanim') !== 'false' && gltf.animations.length) {
            mixer = new THREE.AnimationMixer(model);
            gltf.animations.forEach(function (clip) { mixer.clipAction(clip).play(); });
          }
        }, undefined, demo);
      } else demo();
    }

    var dragging = false, lastX = 0, lastY = 0;
    if (interactive) {
      renderer.domElement.addEventListener('pointerdown', function (e) { dragging = true; lastX = e.clientX; lastY = e.clientY; });
      window.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        pivot.rotation.y += (e.clientX - lastX) * 0.01;
        pivot.rotation.x += (e.clientY - lastY) * 0.01;
        lastX = e.clientX; lastY = e.clientY;
      });
      window.addEventListener('pointerup', function () { dragging = false; });
    }

    var visible = true;
    new IntersectionObserver(function (e) { visible = e[0].isIntersecting; }).observe(elem);
    var autoRotate = elem.getAttribute('data-autorotate') !== 'false' && kind !== 'photo';
    var rotSpeed = parseFloat(elem.getAttribute('data-speed')) || 1;
    (function tick() {
      requestAnimationFrame(tick);
      if (!visible) return;
      var dt = clock.getDelta();
      if (autoRotate && !dragging && kind !== 'custom') pivot.rotation.y += dt * 0.6 * rotSpeed;
      if (kind === 'heart') pivot.position.y = Math.sin(clock.elapsedTime * 1.4) * 0.08;
      if (typeof userUpdate === 'function') { try { userUpdate(dt); } catch (e) {} }
      if (mixer) mixer.update(dt);
      renderer.render(scene, camera);
    })();
  }
})();`;
  }

  // src/editor/main.js
  async function boot() {
    const shared = document.createElement("style");
    shared.id = "wb-component-css";
    shared.textContent = COMPONENT_CSS;
    document.head.append(shared);
    const store = new ProjectStore();
    await store.init();
    const assets = new AssetManager(store);
    await assets.init();
    assets.injectFonts();
    assets.on("change", () => assets.injectFonts());
    const customStyle = document.createElement("style");
    customStyle.id = "wb-custom-css";
    document.head.append(customStyle);
    const syncCustomCSS = () => {
      customStyle.textContent = store.project.custom?.css || "";
    };
    store.on("change", syncCustomCSS);
    syncCustomCSS();
    const view = new CanvasView(store);
    const three = new ThreeManager(assets);
    new Interactions(store, view);
    const panels = new Panels(store, assets, view);
    new PropertiesPanel(store, assets, view);
    new DrawTool(store, assets, view);
    const exporter = new Exporter(store, assets);
    const repaint = () => renderPage(view.artboard, store, assets, { mountEmbeds: (root) => three.mountAll(root) });
    store.on("change", repaint);
    store.on("page", () => view.fit());
    buildTopbar(store, view, exporter, assets, repaint);
    buildMobileNav(store, panels, view);
    bindKeyboard(store, view);
    view.syncSize();
    repaint();
    view.fit();
  }
  function buildTopbar(store, view, exporter, assets, repaint) {
    const bar = document.getElementById("topbar");
    const savedDot = el("span", { class: "saved-dot", title: "Guardado autom\xE1tico activo", text: "\u25CF" });
    store.on("saved", () => {
      savedDot.classList.add("flash");
      setTimeout(() => savedDot.classList.remove("flash"), 600);
    });
    const deviceButtons = el("div", { class: "seg" }, Object.entries(DEVICES).map(([key, meta]) => el("button", {
      class: `seg-btn${store.device === key ? " active" : ""}`,
      text: `${meta.icon} ${meta.label}`,
      dataset: { device: key },
      title: `${meta.width}px`,
      onclick: () => store.setDevice(key)
    })));
    store.on("device", () => {
      deviceButtons.querySelectorAll(".seg-btn").forEach((btn) => btn.classList.toggle("active", btn.dataset.device === store.device));
    });
    const zoomLabel = el("span", { class: "zoom-label", text: "100%" });
    store.on("view", () => {
      zoomLabel.textContent = `${Math.round(store.zoom * 100)}%`;
    });
    const fileInput = el("input", {
      type: "file",
      accept: ".json,.html,.htm",
      style: { display: "none" },
      onchange: async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const text2 = await file.text();
          let data;
          if (/\.html?$/i.test(file.name)) {
            if (text2.includes('id="wb-project"')) {
              data = parseProjectFromHTML(text2);
            } else {
              const [asset2] = await assets.importFiles([file]);
              store.addNode("htmlEmbed", { x: 120, y: 120 }, { props: { assetId: asset2.id, interactive: true } });
              e.target.value = "";
              return;
            }
          } else {
            data = JSON.parse(text2);
          }
          if (Array.isArray(data.assetsData)) {
            await assets.importData(data.assetsData);
            delete data.assetsData;
          }
          store.importJSON(data);
        } catch (err) {
          alert(`No se pudo importar: ${err.message}`);
        }
        e.target.value = "";
      }
    });
    bar.append(
      el("div", { class: "brand", text: "\u25C6 Builder" }),
      savedDot,
      el("div", { class: "sep" }),
      el("button", { class: "btn", text: "\u21B6", title: "Deshacer (Ctrl+Z)", onclick: () => store.undo() }),
      el("button", { class: "btn", text: "\u21B7", title: "Rehacer (Ctrl+Y)", onclick: () => store.redo() }),
      el("div", { class: "sep" }),
      deviceButtons,
      el("div", { class: "sep" }),
      el("button", { class: "btn", text: "\u2212", title: "Alejar", onclick: () => view.zoomAt(innerWidth / 2, innerHeight / 2, 0.85) }),
      zoomLabel,
      el("button", { class: "btn", text: "+", title: "Acercar", onclick: () => view.zoomAt(innerWidth / 2, innerHeight / 2, 1.18) }),
      el("button", { class: "btn", text: "\u2922", title: "Ajustar a pantalla", onclick: () => view.fit() }),
      el("div", { class: "sep" }),
      el("button", { class: "btn", text: "\u270E Dibujar", onclick: () => store.setTool(store.tool === "draw" ? "select" : "draw") }),
      el("span", { class: "spacer" }),
      el("button", { class: "btn", text: "\u25B6 Vista previa", onclick: () => togglePreview(store, view, repaint, assets) }),
      el("div", { class: "sep" }),
      fileInput,
      el("button", { class: "btn", text: "\u2B71 Importar", title: "Importar proyecto .json", onclick: () => fileInput.click() }),
      el("button", {
        class: "btn",
        text: "\u2B73 Guardar .json",
        title: "Descarga el proyecto COMPLETO (incluye tus GIFs, im\xE1genes y v\xEDdeos)",
        onclick: () => {
          const data = { ...store.exportJSON(), assetsData: assets.exportData() };
          download(
            `${store.project.meta.name}.json`,
            new Blob([JSON.stringify(data)], { type: "application/json" })
          );
        }
      }),
      el("button", {
        class: "btn primary",
        text: "\u{1F4F1} HTML (1 archivo)",
        title: "Todo el sitio en un \xFAnico archivo autocontenido: \xE1brelo directamente en el m\xF3vil",
        onclick: async (e) => {
          e.target.disabled = true;
          try {
            await exporter.exportSingle();
          } catch (err) {
            alert(`Error al exportar: ${err.message}`);
            console.error(err);
          }
          e.target.disabled = false;
        }
      }),
      el("button", {
        class: "btn primary",
        text: "\u2B07 Sitio (.zip)",
        title: "Carpeta de proyecto completa para subir a un hosting",
        onclick: async (e) => {
          e.target.disabled = true;
          e.target.textContent = "Empaquetando\u2026";
          try {
            await exporter.export();
          } catch (err) {
            alert(`Error al exportar: ${err.message}`);
            console.error(err);
          }
          e.target.disabled = false;
          e.target.textContent = "\u2B07 Sitio (.zip)";
        }
      }),
      el("button", {
        class: "btn danger",
        text: "\u{1F5D1} Nuevo",
        title: "Proyecto nuevo (borra el actual)",
        onclick: () => {
          if (!confirm("\xBFEmpezar un proyecto nuevo? El actual se descartar\xE1.")) return;
          const template = confirm("\xBFEmpezar con la plantilla de ejemplo?\n(Aceptar = plantilla \xB7 Cancelar = lienzo en blanco)");
          store.reset(!template);
        }
      })
    );
  }
  function parseProjectFromHTML(html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    const embedded = doc.getElementById("wb-project");
    if (!embedded) throw new Error("Este HTML no contiene un proyecto del builder (falta #wb-project)");
    const data = JSON.parse(embedded.textContent);
    data.custom ||= { css: "", js: "" };
    const extraCSS = [...doc.querySelectorAll("style.custom")].map((s) => s.textContent).join("\n");
    const extraJS = [...doc.querySelectorAll("script.custom")].map((s) => s.textContent).join("\n");
    if (extraCSS && !data.custom.css.includes(extraCSS)) data.custom.css += `
/* detectado en el HTML importado */
${extraCSS}`;
    if (extraJS && !data.custom.js.includes(extraJS)) data.custom.js += `
/* detectado en el HTML importado */
${extraJS}`;
    return data;
  }
  function buildMobileNav(store, panels, view) {
    const left = document.getElementById("left-panel");
    const right = document.getElementById("right-panel");
    const closeAll = () => {
      left.classList.remove("open");
      right.classList.remove("open");
      nav.querySelectorAll("button").forEach((b) => b.classList.remove("active"));
    };
    const item = (icon, label, open2) => el("button", {
      onclick: (e) => {
        const btn = e.currentTarget;
        const wasActive = btn.classList.contains("active");
        closeAll();
        if (!wasActive) {
          open2();
          btn.classList.add("active");
        }
      }
    }, [el("span", { class: "mn-icon", text: icon }), el("span", { class: "mn-label", text: label })]);
    const fab = el("button", {
      id: "fab-add",
      title: "A\xF1adir elemento",
      onclick: () => {
        const wasOpen = left.classList.contains("open");
        closeAll();
        if (!wasOpen) {
          panels.openTab("componentes");
          left.classList.add("open");
          if (navigator.vibrate) navigator.vibrate(10);
        }
      }
    }, ["\uFF0B"]);
    document.body.append(fab);
    const nav = el("nav", { id: "mobile-nav" }, [
      item("\u25A6", "Piezas", () => {
        panels.openTab("componentes");
        left.classList.add("open");
      }),
      item("\u{1F5BC}", "Assets", () => {
        panels.openTab("assets");
        left.classList.add("open");
      }),
      item("\u266B", "M\xFAsica", () => {
        panels.openTab("musica");
        left.classList.add("open");
      }),
      item("\u{1F4C4}", "P\xE1ginas", () => {
        panels.openTab("paginas");
        left.classList.add("open");
      }),
      item("\u2263", "Capas", () => {
        panels.openTab("capas");
        left.classList.add("open");
      }),
      item("\u2726", "Dise\xF1o", () => {
        right.classList.add("open");
      })
    ]);
    document.body.append(nav);
    view.viewport.addEventListener("pointerdown", closeAll);
    store.on("tool", () => {
      if (store.tool === "draw") closeAll();
    });
  }
  var previewCleanup = null;
  function togglePreview(store, view, repaint, assets) {
    const body = document.body;
    if (body.classList.contains("preview")) {
      body.classList.remove("preview");
      previewCleanup?.();
      previewCleanup = null;
      repaint();
      return;
    }
    body.classList.add("preview");
    store.clearSelection();
    repaint();
    const artboard = view.artboard;
    const animations = [];
    for (const node2 of store.pageNodes()) {
      const elem = artboard.querySelector(`[data-id="${node2.id}"]`);
      if (!elem) continue;
      const anim = node2.animation;
      const fire = () => {
        if (anim.custom) {
          elem.style.animation = "none";
          void elem.offsetWidth;
          elem.style.animation = anim.custom;
        } else {
          animations.push(playAnimation(elem, anim));
        }
      };
      if (anim && (anim.custom || anim.preset && anim.preset !== "ninguna")) {
        if (anim.trigger === "load") fire();
        else if (anim.trigger === "click") elem.addEventListener("click", fire);
        else if (anim.trigger === "hover") elem.addEventListener("mouseenter", fire);
        else if (anim.trigger === "hold") {
          let holdTimer = null;
          elem.addEventListener("pointerdown", () => {
            holdTimer = setTimeout(fire, 550);
          });
          ["pointerup", "pointerleave"].forEach((ev) => elem.addEventListener(ev, () => clearTimeout(holdTimer)));
        } else if (anim.trigger === "scroll") {
          const io = new IntersectionObserver(([entry]) => {
            if (entry.isIntersecting) {
              fire();
              io.disconnect();
            }
          }, { threshold: 0.25 });
          io.observe(elem);
        }
      }
    }
    const sounds = {};
    for (const asset2 of assets?.list({ kind: "audio" }) || []) sounds[asset2.id] = asset2.data;
    const disposeEffects = wbEffects(artboard, { editor: true, runScripts: true });
    const disposeActions = wbActions(artboard, {
      editor: true,
      sounds,
      stage: () => artboard,
      goToPage: (id) => store.setPage(id),
      pageOrder: () => store.project.pages.map((p) => p.id),
      currentPage: () => store.pageId,
      playAnim: (id, targetEl) => {
        const targetNode = store.node(id);
        if (targetEl && targetNode) playAnimation(targetEl, targetNode.animation);
      },
      // Salida animada en vista previa (WAAPI, mismos presets que el export)
      playExit: (targetEl, done) => {
        const targetNode = store.node(targetEl.dataset.id);
        const anim = targetNode && playExitAnimation(targetEl, targetNode.animationOut);
        if (!anim) return false;
        anim.finished.then(() => {
          done();
          anim.cancel();
        }).catch(done);
        return true;
      }
    });
    try {
      const code = `${store.project.custom?.js || ""}
${store.page.custom?.js || ""}`;
      if (code.trim()) new Function(code)();
    } catch (e) {
      console.warn("JS personalizado:", e);
    }
    previewCleanup = () => {
      animations.forEach((a) => a?.cancel());
      disposeEffects();
      disposeActions();
    };
  }
  function bindKeyboard(store, view) {
    window.addEventListener("keydown", (e) => {
      if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable) return;
      const mod = e.ctrlKey || e.metaKey;
      if (mod && e.shiftKey && e.key.toLowerCase() === "c") {
        e.preventDefault();
        store.copyStyle();
      } else if (mod && e.shiftKey && e.key.toLowerCase() === "v") {
        e.preventDefault();
        store.pasteStyle();
      } else if (mod && e.key === "z") {
        e.preventDefault();
        e.shiftKey ? store.redo() : store.undo();
      } else if (mod && e.key === "y") {
        e.preventDefault();
        store.redo();
      } else if (mod && e.key === "c") {
        store.copy();
      } else if (mod && e.key === "v") {
        store.paste();
      } else if (mod && e.key === "d") {
        e.preventDefault();
        store.duplicateNodes();
      } else if (mod && e.key === "s") {
        e.preventDefault();
        store.persist();
      } else if (mod && e.key === "a") {
        e.preventDefault();
        store.select(store.pageNodes().map((n) => n.id));
      } else if (e.key === "Delete" || e.key === "Backspace") {
        store.removeNodes();
      } else if (e.key === "Escape") {
        store.clearSelection();
        store.setTool("select");
      } else if (e.key.startsWith("Arrow")) {
        e.preventDefault();
        const step = e.shiftKey ? 10 : 1;
        const [dx, dy] = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
        store.nudge(dx, dy);
      } else if (e.key === "0" && mod) {
        e.preventDefault();
        view.fit();
      }
    });
  }
  boot().catch((err) => {
    console.error(err);
    document.body.innerHTML = `<pre style="color:#f87171;padding:40px">Error al iniciar el editor:
${err.stack}</pre>`;
  });
})();
